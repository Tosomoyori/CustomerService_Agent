<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>三语智能客服 Agent | 跨境通信业务</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --ink: #1f2933; --muted: #7b8794;
    --brand: #e60012; --brand-dark: #c2000f; --user: #e60012; --bot: #eef1f5;
    --line: #e4e9f0; --ok: #0a7d43; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
         background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { background: linear-gradient(135deg, var(--brand), #ff5a36); color: #fff; padding: 14px 20px;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: #fff; color: var(--brand);
          display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; }
  header h1 { font-size: 17px; font-weight: 700; }
  header .sub { font-size: 12px; opacity: .85; }
  .head-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .lang-switch { display: flex; background: rgba(255,255,255,.18); border-radius: 10px; padding: 3px; }
  .lang-switch button { border: 0; background: transparent; color: #fff; padding: 5px 12px;
                        border-radius: 8px; cursor: pointer; font-size: 13px; }
  .lang-switch button.active { background: #fff; color: var(--brand); font-weight: 700; }
  .badge { font-size: 11px; background: rgba(255,255,255,.22); padding: 3px 8px; border-radius: 999px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: var(--radius); line-height: 1.65;
         font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .meta { align-self: flex-start; font-size: 11px; color: var(--muted); margin-top: -6px;
          display: flex; gap: 8px; flex-wrap: wrap; align-items: center; cursor: pointer; }
  .meta .chip { background: #e8edf3; border-radius: 999px; padding: 2px 8px; }
  .meta .chip.tool { background: #e3f2e9; color: var(--ok); }
  .trace { align-self: flex-start; max-width: 86%; background: #10243b; color: #cfe3ff; font-family: Consolas, monospace;
           font-size: 11.5px; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; display: none; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 8px; }
  .quick button { border: 1px solid var(--line); background: var(--card); color: var(--ink);
                  border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .quick button:hover { border-color: var(--brand); color: var(--brand); }
  footer { display: flex; gap: 10px; padding: 12px 20px 16px; background: var(--card); border-top: 1px solid var(--line); }
  #input { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 14px; outline: none; }
  #input:focus { border-color: var(--brand); }
  #send { border: 0; background: var(--brand); color: #fff; border-radius: 12px; padding: 11px 22px;
          font-size: 14px; font-weight: 700; cursor: pointer; }
  #send:hover { background: var(--brand-dark); }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 8px; }
  @media (max-width: 640px) { .msg { max-width: 92%; } }
</style>
</head>
<body>
<header>
  <div class="logo">AI</div>
  <div>
    <h1>三语智能客服 Agent</h1>
    <div class="sub" id="subtitle">跨境通信业务 · 粤/普/英三语智能客服</div>
  </div>
  <div class="head-right">
    <span class="badge" id="modeBadge">…</span>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="auto" class="active">自動</button>
      <button data-lang="zh-HK">粵語</button>
      <button data-lang="zh-CN">普通話</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>

<div id="chat"></div>
<div class="quick" id="quick"></div>
<footer>
  <input id="input" placeholder="輸入問題… / 请输入… / Type your question…" autocomplete="off" />
  <button id="send">發送</button>
</footer>

<script>
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");
const quickEl = document.getElementById("quick");
const traceShown = new Set();
let sessionId = null;
let lang = "auto";

const QUICK = {
  "zh-HK": ["日本漫遊幾多錢？", "有咩大灣區計劃？", "推薦學生計劃", "公司想組網，搵邊種專線？", "投訴收唔到驗證碼", "想搵真人客服"],
  "zh-CN": ["日本漫游多少钱？", "有什么大湾区套餐？", "推荐学生计划", "公司想组网，用哪种专线？", "投诉收不到验证码", "转人工客服"],
  "en": ["Roaming pack for Japan?", "GBA shared data plans?", "Recommend a student plan", "Enterprise networking options?", "Report: can't receive SMS code", "Talk to a human agent"]
};

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderQuick() {
  quickEl.innerHTML = "";
  const list = QUICK[lang === "auto" ? "zh-HK" : lang];
  list.forEach(q => { const b = el("button", null, q); b.onclick = () => send(q); quickEl.appendChild(b); });
}

function addMsg(role, text) {
  const m = el("div", "msg " + role, text);
  chatEl.appendChild(m);
  chatEl.scrollTop = chatEl.scrollHeight;
  return m;
}

function renderTrace(trace) {
  if (!trace || !trace.length) return;
  const box = el("div", "trace");
  box.textContent = trace.map(t => `[${t.stage}] ${t.detail}`).join("\n");
  chatEl.appendChild(box);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function send(text) {
  const content = (text != null ? text : inputEl.value).trim();
  if (!content) return;
  inputEl.value = "";
  addMsg("user", content);
  const typing = el("div", "typing", "…");
  chatEl.appendChild(typing); chatEl.scrollTop = chatEl.scrollHeight;
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: content, session_id: sessionId, lang })
    });
    const data = await resp.json();
    typing.remove();
    sessionId = data.session_id;
    addMsg("bot", data.text);
    const chips = el("div", "meta");
    chips.appendChild(el("span", "chip", "🌐 " + data.language));
    chips.appendChild(el("span", "chip", "🎯 " + data.intent));
    (data.tools || []).forEach(t => chips.appendChild(el("span", "chip tool", "🔧 " + t)));
    const traceBtn = el("span", "chip", "⛓ trace");
    chips.appendChild(traceBtn);
    chatEl.appendChild(chips);
    traceBtn.onclick = () => { const b = chatEl.lastChild.previousSibling; renderTrace(data.trace); };
    chatEl.scrollTop = chatEl.scrollHeight;
  } catch (e) {
    typing.remove();
    addMsg("bot", "网络异常，请稍后再试 / Network error, please retry.");
  }
}

document.getElementById("langSwitch").addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  document.querySelectorAll("#langSwitch button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  lang = btn.dataset.lang;
  renderQuick();
});

sendEl.onclick = () => send();
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

fetch("/api/health").then(r => r.json()).then(d => {
  document.getElementById("modeBadge").textContent = d.mock_mode ? "Mock 模式（离线演示）" : "Live 模式";
});
renderQuick();
addMsg("bot", "你好！我係三語智能客服助理～\n查漫遊、大湾区计划（大灣區計劃）、企業組網、登記工單、轉人工都得。\nHello! Ask me about roaming, GBA plans, enterprise networking, tickets or human handoff.");
</script>
</body>
</html>
